<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<!-- Makes the app scale correctly on phones and tablets -->
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0">

<title>Biased Coin Flip Simulator</title>

<style>

/* =========================================================
   GENERAL PAGE
   ========================================================= */

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f6f8;
    color: #222;
    text-align: center;
    min-height: 100vh;
    padding: 6px 10px 10px;
}

.app {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
}

h1 {
    margin: 3px 0 5px;
    font-size: 1.5rem;
    color: #2c3e50;
}


/* =========================================================
   COIN
   ========================================================= */

.coin-container {
    width: 115px;
    height: 115px;
    margin: 5px auto;
    perspective: 1000px;
}

.coin {
    width: 115px;
    height: 115px;
    position: relative;
    transform-style: preserve-3d;
}

.face {
    position: absolute;
    width: 100%;
    height: 100%;

    border-radius: 50%;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 58px;
    font-weight: bold;

    background:
        radial-gradient(
            circle at 30% 30%,
            #fff5a0,
            #ffd700 40%,
            #d4a017 75%,
            #8b6508
        );

    border: 6px solid #8b6508;

    box-shadow:
        inset 0 0 10px rgba(255,255,255,0.5),
        inset 0 0 20px rgba(0,0,0,0.3),
        0 4px 10px rgba(0,0,0,0.25);
}

.heads {
    color: darkred;
}

.tails {
    color: navy;
    transform: rotateY(180deg);
}


/* =========================================================
   FLIP ANIMATION
   ========================================================= */

@keyframes flipAnimation {
    from {
        transform: rotateY(0deg);
    }

    to {
        transform: rotateY(1800deg);
    }
}

@-webkit-keyframes flipAnimation {
    from {
        -webkit-transform: rotateY(0deg);
    }

    to {
        -webkit-transform: rotateY(1800deg);
    }
}

.flipping {
    animation: flipAnimation 1s ease-in-out;
    -webkit-animation: flipAnimation 1s ease-in-out;
}


/* =========================================================
   RESULT
   ========================================================= */

.result {
    font-size: 18px;
    font-weight: bold;
    min-height: 24px;
    margin: 3px 0;
}


/* =========================================================
   BUTTONS
   ========================================================= */

.controls {
    margin: 2px 0 5px;
}

button {
    padding: 8px 18px;
    min-height: 38px;

    font-size: 15px;

    margin: 2px;

    border: none;
    border-radius: 7px;

    background: #3498db;
    color: white;

    cursor: pointer;

    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
}

button:hover {
    background: #2980b9;
}

button:active {
    transform: scale(0.97);
}

button:disabled {
    background: #95a5a6;
    cursor: default;
}


/* =========================================================
   STATISTICS
   ========================================================= */

.stats-wrapper {
    width: 100%;
    overflow-x: auto;
    margin: 4px 0 5px;
}

table {
    margin: 0 auto;
    border-collapse: collapse;
    background: white;
    font-size: 13px;
}

th,
td {
    border: 1px solid #ccc;
    padding: 5px 12px;
}

th {
    background: #eef2f5;
}


/* =========================================================
   GRAPH
   ========================================================= */

.graph-container {
    width: 100%;
    margin: 3px auto 0;
}

#graph {
    display: block;

    width: 100%;
    height: 260px;

    background: white;
    border: 1px solid #999;
}


/* =========================================================
   TABLET
   ========================================================= */

@media (max-width: 700px) {

    body {
        padding: 5px 8px;
    }

    h1 {
        font-size: 1.3rem;
    }

    .coin-container,
    .coin {
        width: 105px;
        height: 105px;
    }

    .face {
        font-size: 52px;
        border-width: 5px;
    }

    #graph {
        height: 245px;
    }
}


/* =========================================================
   MOBILE PHONE
   ========================================================= */

@media (max-width: 480px) {

    body {
        padding: 4px 5px 8px;
    }

    h1 {
        font-size: 1.2rem;
        margin: 2px 0;
    }

    .coin-container,
    .coin {
        width: 90px;
        height: 90px;
    }

    .coin-container {
        margin: 3px auto;
    }

    .face {
        font-size: 44px;
        border-width: 5px;
    }

    .result {
        font-size: 16px;
        min-height: 20px;
        margin: 2px;
    }

    button {
        min-height: 42px;
        padding: 8px 18px;
        font-size: 15px;
    }

    table {
        width: 100%;
        table-layout: fixed;
        font-size: 11px;
    }

    th,
    td {
        padding: 4px 2px;
        word-wrap: break-word;
    }

    #graph {
        height: 230px;
    }
}


/* Very small phones */

@media (max-width: 350px) {

    .coin-container,
    .coin {
        width: 80px;
        height: 80px;
    }

    .face {
        font-size: 38px;
        border-width: 4px;
    }

    #graph {
        height: 210px;
    }
}

</style>
</head>


<body>

<div class="app">

    <h1>Coin Flip Simulator</h1>


    <!-- COIN -->

    <div class="coin-container">

        <div id="coin" class="coin">

            <div class="face heads">
                H
            </div>

            <div class="face tails">
                T
            </div>

        </div>

    </div>


    <!-- RESULT -->

    <div id="result" class="result">
        Click "Flip Coin"
    </div>


    <!-- BUTTONS -->

    <div class="controls">

        <button id="flipButton" onclick="flipCoin()">
            Flip Coin
        </button>

        <button id="resetButton" onclick="resetSimulation()">
            Reset
        </button>

    </div>


    <!-- STATISTICS -->

    <div class="stats-wrapper">

        <table>

            <tr>
                <th>Total Flips</th>
                <th>Heads</th>
                <th>Tails</th>
                <th>Sample Proportion p̂</th>
            </tr>

            <tr>
                <td id="total">0</td>
                <td id="heads">0</td>
                <td id="tails">0</td>
                <td id="phat">0.000</td>
            </tr>

        </table>

    </div>


    <!-- GRAPH -->

    <div class="graph-container">
        <canvas id="graph"></canvas>
    </div>

</div>


<script>

/* =========================================================
   SIMULATION SETUP

   Probability is deliberately not displayed
   anywhere in the student interface.
   ========================================================= */

const pHeads = 0.42;

let total = 0;
let heads = 0;
let tails = 0;

let proportions = [];

const coin =
    document.getElementById("coin");

const canvas =
    document.getElementById("graph");

const ctx =
    canvas.getContext("2d");


/* =========================================================
   BUTTON CONTROL
   ========================================================= */

function disableButtons(state) {

    document.getElementById("flipButton").disabled = state;
    document.getElementById("resetButton").disabled = state;
}


/* =========================================================
   COIN FACES
   ========================================================= */

function showHeads() {
    coin.style.transform = "rotateY(0deg)";
}

function showTails() {
    coin.style.transform = "rotateY(180deg)";
}


/* =========================================================
   DISPLAY
   ========================================================= */

function updateDisplay() {

    document.getElementById("total").textContent =
        total;

    document.getElementById("heads").textContent =
        heads;

    document.getElementById("tails").textContent =
        tails;

    const phat =
        total === 0 ? 0 : heads / total;

    document.getElementById("phat").textContent =
        phat.toFixed(3);

    drawGraph();
}


/* =========================================================
   FLIP COIN
   ========================================================= */

function flipCoin() {

    disableButtons(true);

    document.getElementById("result").textContent =
        "Flipping...";

    /*
       Removing the animation class first guarantees
       that every subsequent flip animates correctly.
    */

    coin.classList.remove("flipping");

    void coin.offsetWidth;

    coin.classList.add("flipping");


    const isHeads =
        Math.random() < pHeads;


    setTimeout(function() {

        coin.classList.remove("flipping");


        if (isHeads) {

            heads++;

            showHeads();

            document.getElementById("result").textContent =
                "Heads";

        } else {

            tails++;

            showTails();

            document.getElementById("result").textContent =
                "Tails";
        }


        total++;


        /*
           Store the running sample proportion after
           every flip.
        */

        proportions.push(
            heads / total
        );


        updateDisplay();

        disableButtons(false);

    }, 1000);
}


/* =========================================================
   RESET
   ========================================================= */

function resetSimulation() {

    total = 0;
    heads = 0;
    tails = 0;

    proportions = [];

    coin.classList.remove("flipping");

    showHeads();

    document.getElementById("result").textContent =
        'Click "Flip Coin"';

    updateDisplay();
}


/* =========================================================
   RESPONSIVE CANVAS

   The internal canvas resolution adjusts to the screen.
   This makes the graph sharp on phones, tablets and
   high-resolution displays.
   ========================================================= */

function resizeCanvas() {

    const rect =
        canvas.getBoundingClientRect();

    const ratio =
        window.devicePixelRatio || 1;

    canvas.width =
        Math.round(rect.width * ratio);

    canvas.height =
        Math.round(rect.height * ratio);

    ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );

    drawGraph();
}


/* =========================================================
   GRAPH
   ========================================================= */

function drawGraph() {

    const w =
        canvas.clientWidth;

    const h =
        canvas.clientHeight;


    if (w <= 0 || h <= 0) {
        return;
    }


    /*
       Graph margins adjust slightly for mobile screens.
    */

    let left = 52;
    let right = 15;
    let top = 14;
    let bottom = 42;


    if (w < 500) {

        left = 45;
        right = 10;
        bottom = 40;
    }


    const plotWidth =
        w - left - right;

    const plotHeight =
        h - top - bottom;


    /* Clear graph */

    ctx.clearRect(
        0,
        0,
        w,
        h
    );


    ctx.fillStyle =
        "white";


    ctx.fillRect(
        0,
        0,
        w,
        h
    );


    /* =====================================================
       GRID LINES AND Y-AXIS VALUES
       ===================================================== */

    ctx.font =
        w < 500
        ? "10px Arial"
        : "11px Arial";

    ctx.textAlign =
        "right";

    ctx.textBaseline =
        "middle";


    for (let i = 0; i <= 10; i++) {

        const value =
            i / 10;


        const y =
            h -
            bottom -
            value * plotHeight;


        /*
           Horizontal grid line
        */

        ctx.strokeStyle =
            "#d6d6d6";

        ctx.lineWidth =
            1;

        ctx.beginPath();

        ctx.moveTo(
            left,
            y
        );

        ctx.lineTo(
            w - right,
            y
        );

        ctx.stroke();


        /*
           Y-axis value
        */

        ctx.fillStyle =
            "#222";

        ctx.fillText(
            value.toFixed(1),
            left - 7,
            y
        );
    }


    /* =====================================================
       AXES
       ===================================================== */

    ctx.strokeStyle =
        "#222";

    ctx.lineWidth =
        1.2;

    ctx.beginPath();

    ctx.moveTo(
        left,
        top
    );

    ctx.lineTo(
        left,
        h - bottom
    );

    ctx.lineTo(
        w - right,
        h - bottom
    );

    ctx.stroke();


    /* =====================================================
       X-AXIS TITLE
       ===================================================== */

    ctx.fillStyle =
        "#222";


    ctx.font =
        w < 500
        ? "11px Arial"
        : "12px Arial";


    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "alphabetic";


    ctx.fillText(
        "Number of Flips",
        left + plotWidth / 2,
        h - 5
    );


    /* =====================================================
       Y-AXIS TITLE
       ===================================================== */

    ctx.save();


    ctx.translate(
        12,
        top + plotHeight / 2
    );


    ctx.rotate(
        -Math.PI / 2
    );


    ctx.textAlign =
        "center";


    ctx.fillText(
        "Sample Proportion",
        0,
        0
    );


    ctx.restore();


    /* =====================================================
       NO DATA YET
       ===================================================== */

    if (proportions.length === 0) {

        ctx.fillStyle =
            "#777";


        ctx.font =
            w < 500
            ? "12px Arial"
            : "13px Arial";


        ctx.textAlign =
            "center";


        ctx.fillText(
            "Flip the coin to begin",
            left + plotWidth / 2,
            top + plotHeight / 2
        );


        return;
    }


    /* =====================================================
       COLUMN DATA
       ===================================================== */

    /*
       Up to 200 sample proportions are displayed.

       If more than 200 flips occur, the graph displays
       the most recent 200 observations.
    */

    const maxBars =
        200;


    const startIndex =
        Math.max(
            0,
            proportions.length - maxBars
        );


    const data =
        proportions.slice(
            startIndex
        );


    const barWidth =
        plotWidth / data.length;


    /*
       Semi-transparent blue columns allow the
       horizontal scale lines to remain visible.
    */

    ctx.fillStyle =
        "rgba(52, 152, 219, 0.45)";


    for (let i = 0; i < data.length; i++) {

        const x =
            left +
            i * barWidth;


        const barHeight =
            data[i] *
            plotHeight;


        const y =
            h -
            bottom -
            barHeight;


        ctx.fillRect(
            x,
            y,
            Math.max(
                barWidth - 0.5,
                0.6
            ),
            barHeight
        );
    }


    /* =====================================================
       X-AXIS

       Only the current total number of flips is shown.
       No intermediate numbers are displayed.
       ===================================================== */

    ctx.fillStyle =
        "#222";


    ctx.font =
        w < 500
        ? "10px Arial"
        : "11px Arial";


    ctx.textBaseline =
        "top";


    ctx.textAlign =
        "right";


    /*
       Small tick mark at the far right of the x-axis.
    */

    ctx.strokeStyle =
        "#555";

    ctx.lineWidth =
        1;


    ctx.beginPath();


    ctx.moveTo(
        w - right,
        h - bottom
    );


    ctx.lineTo(
        w - right,
        h - bottom + 4
    );


    ctx.stroke();


    /*
       Display only the maximum/current number
       of flips at the far right.
    */

    ctx.fillText(
        total.toString(),
        w - right,
        h - bottom + 7
    );
}


/* =========================================================
   WINDOW RESIZING
   ========================================================= */

let resizeTimer;


window.addEventListener(
    "resize",
    function() {

        clearTimeout(
            resizeTimer
        );


        resizeTimer =
            setTimeout(
                resizeCanvas,
                100
            );
    }
);


/* =========================================================
   PHONE/TABLET ROTATION
   ========================================================= */

window.addEventListener(
    "orientationchange",
    function() {

        setTimeout(
            resizeCanvas,
            150
        );
    }
);


/* =========================================================
   START APP
   ========================================================= */

showHeads();

updateDisplay();


window.addEventListener(
    "load",
    resizeCanvas
);

</script>

</body>
</html>
